spring.application.name=hora-certa
server.port=8080

# Perfil padrão: dev (no container e no Azure use SPRING_PROFILES_ACTIVE=prd)
spring.profiles.default=dev

# Versão da API usada nas rotas: /api/v1/...
api.version=v1

# Swagger na raiz: a rota "/" abre a documentação
springdoc.swagger-ui.path=/
springdoc.swagger-ui.tags-sorter=alpha

# JSON na ordem dos campos do DTO (id primeiro)
spring.jackson.mapper.sort-properties-alphabetically=false

# JPA / Hibernate
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Nunca expor stack trace ou mensagens internas nas respostas
server.error.include-stacktrace=never
server.error.include-message=never

server.forward-headers-strategy=framework
