# Desenvolvimento: SQL Server local (ex.: docker compose up)
# A senha vem SEMPRE da variável DB_PWD, nunca do repositório.
spring.datasource.url=jdbc:sqlserver://${DB_SERVER_URL:localhost}:${DB_SERVER_PORT:1433};databaseName=${DB_SCHEMA:horacerta};encrypt=false;trustServerCertificate=true
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PWD}

spring.jpa.show-sql=true
