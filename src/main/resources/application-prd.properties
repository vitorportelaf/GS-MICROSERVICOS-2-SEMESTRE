# Produção (Azure): todos os dados de conexão vêm de variáveis de ambiente
spring.datasource.url=jdbc:sqlserver://${DB_SERVER_URL}:${DB_SERVER_PORT};databaseName=${DB_SCHEMA};encrypt=true;trustServerCertificate=false;hostNameInCertificate=*.database.windows.net;loginTimeout=30
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PWD}

spring.jpa.show-sql=false
