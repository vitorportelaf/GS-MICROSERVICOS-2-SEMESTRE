name: Continuous Delivery

# Roda automaticamente a cada push na branch principal (main):
# compila, testa, constrói a imagem Docker e publica no Docker Hub.
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  push_to_docker_hub:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build e testes
        run: mvn -B clean verify

      - name: Generate image tags
        run: |
          echo "VERSION=v${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          echo "COMMIT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKER_USER }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ vars.DOCKER_USER }}/hora-certa:${{ env.VERSION }}
            ${{ vars.DOCKER_USER }}/hora-certa:${{ env.COMMIT_SHA }}
            ${{ vars.DOCKER_USER }}/hora-certa:latest

      - name: Resumo
        run: |
          echo "### Imagem publicada no Docker Hub" >> "$GITHUB_STEP_SUMMARY"
          echo "- ${{ vars.DOCKER_USER }}/hora-certa:${{ env.VERSION }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- ${{ vars.DOCKER_USER }}/hora-certa:${{ env.COMMIT_SHA }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- ${{ vars.DOCKER_USER }}/hora-certa:latest" >> "$GITHUB_STEP_SUMMARY"
